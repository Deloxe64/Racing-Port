name: Racing Port - PC Native Port + C# Launcher (Limpio)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-racing-port-pc:
    runs-on: windows-latest

    steps:
    - name: 1. Descargar repositorio principal
      uses: actions/checkout@v4

    - name: 2. Configurar entorno de compilacion (Python)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Clonar fuente descompilada en C
      shell: powershell
      run: |
        git clone https://github.com/n64decomp/dkr.git dkr_src

    - name: 4. Instalar dependencias de extraccion
      shell: powershell
      run: |
        python -m pip install --upgrade pip
        pip install capstone colorama pyyaml

    - name: 5. Descargar ROM temporalmente solo para extraer assets en la nube
      shell: powershell
      run: |
        Write-Host "Descargando ROM base de manera automatica para extraccion..."
        $romUrl = "https://github.com/haxrob/roms/raw/main/Diddy%20Kong%20Racing%20(USA).z64"
        try {
            Invoke-WebRequest -Uri $romUrl -OutFile "dkr_src\baserom.us.v10.z64"
            Write-Host "ROM descargada y lista para la extraccion de assets."
        } catch {
            Write-Host "Aviso: No se pudo descargar la ROM remota."
        }

    - name: 6. Estructurar carpetas de salida de Racing Port
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "src_launcher"
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_PC"
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_PC\mods"
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_PC\assets"

    - name: 7. Generar Lanzador C# con Interfaz Tematica "Racing Port"
      shell: powershell
      run: |
        $code = @"
        using System;
        using System.Drawing;
        using System.Windows.Forms;
        using System.Diagnostics;
        using System.IO;

        namespace RacingPort
        {
            public class MainForm : Form
            {
                private ComboBox cbResolution, cbFPS, cbAspect, cbDisplayMode;
                private TrackBar tbMusicVolume, tbSFXVolume;
                private Label lblMusicVal, lblSFXVal, lblRomStatus;
                private Panel panelMenu, panelConfig;
                private Timer animTimer;
                private int animStep = 0;
                private Label titleLabel;

                public MainForm()
                {
                    this.Text = "Racing Port - Official Launcher";
                    this.Size = new Size(720, 520);
                    this.StartPosition = FormStartPosition.CenterScreen;
                    this.FormBorderStyle = FormBorderStyle.FixedSingle;
                    this.MaximizeBox = false;
                    this.BackColor = Color.FromArgb(15, 23, 11);
                    this.ForeColor = Color.White;

                    InitUI();
                    InitAnimation();
                }

                private void InitAnimation()
                {
                    animTimer = new Timer();
                    animTimer.Interval = 70;
                    animTimer.Tick += (s, e) => {
                        animStep++;
                        int alpha = (int)(180 + 75 * Math.Sin(animStep * 0.15));
                        titleLabel.ForeColor = Color.FromArgb(255, 255, Math.Min(255, alpha / 2), 0);
                    };
                    animTimer.Start();
                }

                private void InitUI()
                {
                    panelMenu = new Panel { Dock = DockStyle.Fill, Visible = true, BackColor = Color.Transparent };

                    titleLabel = new Label {
                        Text = "RACING PORT",
                        Font = new Font("Segoe UI", 26, FontStyle.Bold),
                        ForeColor = Color.Gold,
                        AutoSize = false,
                        TextAlign = ContentAlignment.MiddleCenter,
                        Size = new Size(700, 50),
                        Location = new Point(10, 15)
                    };

                    Label subtitle = new Label {
                        Text = "Native C/C++ Engine & Custom Launcher v1.0",
                        Font = new Font("Segoe UI", 10, FontStyle.Italic),
                        ForeColor = Color.SpringGreen,
                        AutoSize = false,
                        TextAlign = ContentAlignment.MiddleCenter,
                        Size = new Size(700, 25),
                        Location = new Point(10, 65)
                    };

                    lblRomStatus = new Label {
                        Text = CheckRomState() ? "Estado de Assets: LISTOS PARA JUGAR" : "Estado: Carga tu ROM base (*.z64)",
                        Font = new Font("Segoe UI", 9, FontStyle.Bold),
                        ForeColor = CheckRomState() ? Color.SpringGreen : Color.Coral,
                        AutoSize = false,
                        TextAlign = ContentAlignment.MiddleCenter,
                        Size = new Size(700, 20),
                        Location = new Point(10, 95)
                    };

                    panelMenu.Controls.Add(titleLabel);
                    panelMenu.Controls.Add(subtitle);
                    panelMenu.Controls.Add(lblRomStatus);

                    panelMenu.Controls.Add(CreateRacingButton("JUGAR RACING PORT", 130, (s, e) => LaunchGame()));
                    panelMenu.Controls.Add(CreateRacingButton("CARGAR / AÑADIR ROM", 190, (s, e) => SelectRomFile()));
                    panelMenu.Controls.Add(CreateRacingButton("CONFIGURACION", 250, (s, e) => ShowConfig(true)));
                    panelMenu.Controls.Add(CreateRacingButton("MODS & TRACKS", 310, (s, e) => OpenModsFolder()));
                    panelMenu.Controls.Add(CreateRacingButton("SALIR", 370, (s, e) => Application.Exit()));

                    panelConfig = new Panel { Dock = DockStyle.Fill, Visible = false, BackColor = Color.Transparent };

                    Label cfgTitle = new Label {
                        Text = "CONFIGURACION DE RACING PORT",
                        Font = new Font("Segoe UI", 16, FontStyle.Bold),
                        ForeColor = Color.Cyan,
                        Size = new Size(700, 40),
                        TextAlign = ContentAlignment.MiddleCenter,
                        Location = new Point(10, 10)
                    };
                    panelConfig.Controls.Add(cfgTitle);

                    panelConfig.Controls.Add(CreateLabel("Resolucion de Pantalla:", 70));
                    cbResolution = new ComboBox { Location = new Point(280, 67), DropDownStyle = ComboBoxStyle.DropDownList, Width = 220, Font = new Font("Segoe UI", 9) };
                    cbResolution.Items.AddRange(new string[] { "480p (854x480)", "720p (1280x720)", "1080p (1920x1080)" });
                    cbResolution.SelectedIndex = 1;
                    panelConfig.Controls.Add(cbResolution);

                    panelConfig.Controls.Add(CreateLabel("Tasa de FPS:", 110));
                    cbFPS = new ComboBox { Location = new Point(280, 107), DropDownStyle = ComboBoxStyle.DropDownList, Width = 220, Font = new Font("Segoe UI", 9) };
                    cbFPS.Items.AddRange(new string[] { "60 FPS", "90 FPS", "120 FPS" });
                    cbFPS.SelectedIndex = 0;
                    panelConfig.Controls.Add(cbFPS);

                    panelConfig.Controls.Add(CreateLabel("Relacion de Aspecto:", 150));
                    cbAspect = new ComboBox { Location = new Point(280, 147), DropDownStyle = ComboBoxStyle.DropDownList, Width = 220, Font = new Font("Segoe UI", 9) };
                    cbAspect.Items.AddRange(new string[] { "Ajustar a Pantalla (Dispositivo)", "4:3 (Clasico N64)", "16:9 (Panoramica)" });
                    cbAspect.SelectedIndex = 0;
                    panelConfig.Controls.Add(cbAspect);

                    panelConfig.Controls.Add(CreateLabel("Modo de Visualizacion:", 190));
                    cbDisplayMode = new ComboBox { Location = new Point(280, 187), DropDownStyle = ComboBoxStyle.DropDownList, Width = 220, Font = new Font("Segoe UI", 9) };
                    cbDisplayMode.Items.AddRange(new string[] { "Pantalla Completa (Fullscreen)", "Ventana Panoramica" });
                    cbDisplayMode.SelectedIndex = 0;
                    panelConfig.Controls.Add(cbDisplayMode);

                    panelConfig.Controls.Add(CreateLabel("Volumen Musica:", 240));
                    tbMusicVolume = new TrackBar { Location = new Point(280, 235), Minimum = 0, Maximum = 100, Value = 80, Width = 220, TickFrequency = 10 };
                    lblMusicVal = new Label { Text = "80%", Location = new Point(510, 240), AutoSize = true, ForeColor = Color.Yellow, Font = new Font("Segoe UI", 9, FontStyle.Bold) };
                    tbMusicVolume.ValueChanged += (s, e) => lblMusicVal.Text = tbMusicVolume.Value + "%";
                    panelConfig.Controls.Add(tbMusicVolume);
                    panelConfig.Controls.Add(lblMusicVal);

                    panelConfig.Controls.Add(CreateLabel("Efectos de Sonido (SFX):", 290));
                    tbSFXVolume = new TrackBar { Location = new Point(280, 285), Minimum = 0, Maximum = 100, Value = 100, Width = 220, TickFrequency = 10 };
                    lblSFXVal = new Label { Text = "100%", Location = new Point(510, 290), AutoSize = true, ForeColor = Color.Yellow, Font = new Font("Segoe UI", 9, FontStyle.Bold) };
                    tbSFXVolume.ValueChanged += (s, e) => lblSFXVal.Text = tbSFXVolume.Value + "%";
                    panelConfig.Controls.Add(tbSFXVolume);
