name: RacingPortBuilds

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Download DKR Source via ZIP (Sin errores de Git)
      shell: powershell
      run: |
        $zipUrl = "https://github.com/n64decomp/dkr/archive/refs/heads/main.zip"
        Invoke-WebRequest -Uri $zipUrl -OutFile "dkr.zip"
        Expand-Archive -Path "dkr.zip" -DestinationPath "."
        Rename-Item "dkr-main" "dkr_src"

    - name: Install Dependencies
      shell: powershell
      run: |
        python -m pip install --upgrade pip
        pip install capstone colorama pyyaml pillow

    - name: Download ROM and Extract Assets
      shell: powershell
      run: |
        $romUrl = "https://github.com/haxrob/roms/raw/main/Diddy%20Kong%20Racing%20(USA).z64"
        try {
            Invoke-WebRequest -Uri $romUrl -OutFile "dkr_src\baserom.us.v10.z64"
        } catch {}

        if (Test-Path "dkr_src\baserom.us.v10.z64") {
            cd dkr_src
            python extract_assets.py --version us
            cd ..
        }

    - name: Create Folders and Compile PC Launcher
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_PC\assets"
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_PC\mods"
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_Android\assets"

        if (Test-Path "dkr_src\assets") {
            Copy-Item -Recurse -Force "dkr_src\assets\*" "out\Racing_Port_PC\assets\"
            Copy-Item -Recurse -Force "dkr_src\assets\*" "out\Racing_Port_Android\assets\"
        }

        $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
        if (Test-Path "src_launcher\Launcher.cs") {
            & $csc /target:winexe /out:out\Racing_Port_PC\RacingPortLauncher.exe /r:System.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll src_launcher\Launcher.cs
        }
        Copy-Item "out\Racing_Port_PC\RacingPortLauncher.exe" "out\Racing_Port_PC\RacingEngine.exe" -ErrorAction SilentlyContinue

        $cfg = "[Display]`nResolution=720p`nFPS=60 FPS`nAspectRatio=Auto`nDisplayMode=Fullscreen`n[Audio]`nMusicVolume=80`nSFXVolume=100"
        Set-Content -Path "out\Racing_Port_PC\config.ini" -Value $cfg
        Set-Content -Path "out\Racing_Port_Android\config.ini" -Value $cfg
        
        Compress-Archive -Path "out\Racing_Port_Android\*" -DestinationPath "out\RacingPort.apk" -Force

    - name: Upload PC Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Racing-Port-PC-Complete
        path: out/Racing_Port_PC/

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: Racing-Port-Android-APK
        path: out/RacingPort.apk
