name: RacingPortBuilds

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-pc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: SetupFoldersPC
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_PC"
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_PC\mods"
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_PC\assets"

    - name: BuildLauncherPC
      shell: powershell
      run: |
        $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
        & $csc /target:winexe /out:out\Racing_Port_PC\RacingPortLauncher.exe /r:System.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll src_launcher\Launcher.cs
        Copy-Item "out\Racing_Port_PC\RacingPortLauncher.exe" "out\Racing_Port_PC\RacingEngine.exe"

    - name: UploadPC
      uses: actions/upload-artifact@v4
      with:
        name: Racing-Port-PC
        path: out/Racing_Port_PC/

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: SetupAndroidStructure
      run: |
        mkdir -p android_build/app/src/main
        mkdir -p android_build/app/assets

        cat << 'EOF' > android_build/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.racing.port"
            android:versionCode="1"
            android:versionName="1.0">
            <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33" />
            <application android:label="Racing Port" android:icon="@mipmap/ic_launcher">
                <activity android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > android_build/app/assets/config.ini
        [Display]
        Resolution=720p
        FPS=60
        AspectRatio=16:9
        TouchControls=1
        EOF

    - name: PackageAndroidAssets
      run: |
        cd android_build/app
        zip -r ../../RacingPort_Android_Assets.zip assets/

    - name: UploadAndroid
      uses: actions/upload-artifact@v4
      with:
        name: Racing-Port-Android-Package
        path: RacingPort_Android_Assets.zip
