name: RacingPortBuilds

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-pc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: SetupFoldersPC
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_PC"
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_PC\mods"
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_PC\assets"

    - name: BuildLauncherPC
      shell: powershell
      run: |
        $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
        & $csc /target:winexe /out:out\Racing_Port_PC\RacingPortLauncher.exe /r:System.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll src_launcher\Launcher.cs
        Copy-Item "out\Racing_Port_PC\RacingPortLauncher.exe" "out\Racing_Port_PC\RacingEngine.exe"

    - name: UploadPC
      uses: actions/upload-artifact@v4
      with:
        name: Racing-Port-PC
        path: out/Racing_Port_PC/

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: SetupFoldersAndroid
      run: |
        mkdir -p android_build/assets
        mkdir -p android_build/out

    - name: CreateConfigAndroid
      run: |
        cat << 'EOF' > android_build/assets/config.ini
        [Display]
        Resolution=720p
        FPS=60
        AspectRatio=16:9
        TouchControls=1
        EOF

    - name: PackAPK
      run: |
        cd android_build
        zip -r out/RacingPort.apk assets/

    - name: UploadAndroid
      uses: actions/upload-artifact@v4
      with:
        name: Racing-Port-Android-APK
        path: android_build/out/RacingPort.apk
