name: RacingPortFullBuilds

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-pc-and-android:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Clone C Source Code
      shell: powershell
      run: |
        git config --global core.askPass ""
        git clone --recursive https://github.com/n64decomp/dkr.git dkr_src

    - name: Install Python Dependencies
      shell: powershell
      run: |
        python -m pip install --upgrade pip
        pip install capstone colorama pyyaml

    - name: Fetch ROM for Asset Extraction
      shell: powershell
      run: |
        $url = "https://github.com/haxrob/roms/raw/main/Diddy%20Kong%20Racing%20(USA).z64"
        try {
            Invoke-WebRequest -Uri $url -OutFile "dkr_src\baserom.us.v10.z64"
            Write-Host "ROM descargada para extraccion."
        } catch {
            Write-Host "Fallo al descargar ROM remota."
        }

    - name: Create Output Directories
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_PC\assets"
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_PC\mods"
        New-Item -ItemType Directory -Force -Path "out\Racing_Port_Android\assets"

    - name: Compile CSharp Launcher for PC
      shell: powershell
      run: |
        $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
        & $csc /target:winexe /out:out\Racing_Port_PC\RacingPortLauncher.exe /r:System.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll src_launcher\Launcher.cs
        Copy-Item "out\Racing_Port_PC\RacingPortLauncher.exe" "out\Racing_Port_PC\RacingEngine.exe"

    - name: Generate Configurations
      shell: powershell
      run: |
        $cfg = "[Display]`nResolution=720p`nFPS=60 FPS`nAspectRatio=Auto`nDisplayMode=Fullscreen`n[Audio]`nMusicVolume=80`nSFXVolume=100"
        Set-Content -Path "out\Racing_Port_PC\config.ini" -Value $cfg
        Set-Content -Path "out\Racing_Port_Android\config.ini" -Value $cfg

    - name: Package PC Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Racing-Port-PC-Functional
        path: out/Racing_Port_PC/

    - name: Package Android Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Racing-Port-Android-Functional
        path: out/Racing_Port_Android/
